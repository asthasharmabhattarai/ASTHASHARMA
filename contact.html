<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact form to submit workshop queries and feedback">
  <title>Contact — Semantic HTML Workshop</title>
</head>

<body>

  <header>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="contact-form-section">
      <h2>Get in Touch</h2>
      <p>Please fill out the form below to send us a message.</p>

      <form action="/submit" method="post">
        
        <p>
          <label for="full-name">Full Name:</label><br>
          <input type="text" id="full-name" name="full_name" placeholder="Jane Doe" required>
        </p>

        <p>
          <label for="email-address">Email Address:</label><br>
          <input type="email" id="email-address" name="email" placeholder="jane@example.com" required>
        </p>

        <p>
          <label for="subject">Subject:</label><br>
          <input type="text" id="subject" name="subject">
        </p>

        <p>
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="5" required></textarea>
        </p>

        <p>
          <button type="submit">Send Message</button>
        </p>

      </form>
    </section>

    <aside>
      <h3>Office Hours</h3>
      <p>Monday – Friday<br>9:00 AM – 5:00 PM</p>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 Semantic HTML Workshop. All rights reserved.</p>
  </footer>

</body>

</html>
