<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">


    <style>
        header{
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            gap:30%;
            padding: 20px;

        }
        .merienda-font {
            font-family: "Merienda", cursive;
            font-optical-sizing: auto;
            font-weight: 800;
            font-style: normal;
        }

        .btn{
            border: none;
            display: flex;
            flex-direction: row;

            gap:20px;

        }
        .login-btn{
            background-color: black;
            color: white;
            border: none;
            min-width: 80px;
            max-height: 40px;

        }
        .sign-up-btn{
            background-color: black;
            color: white;
            border: none;
            min-width: 80px;
            max-height: 40px;
        
        }
        .sign-up-btn:hover{
            transform: scale(1.3);
        }

        .login-btn:hover{
            transform: scale(1.3);
        }

        .icon{
            border-radius: 50%;
            max-width: 100px;
            max-height: 100px;
        }
        .details{
            font-weight: 600;
            line-height: 1.4;
        }

        .detail-container{
            display: flex;
            flex-direction: row;
            gap: 15px;
        }

        .merienda-font h2{
            font-weight: 700;
            font-size: 26px;
        }
        .merienda-font p{
            font-weight: 400;
            font: 20px;
        }


    </style>
</head>
<body>
    <header>
        <div class="icon-container">
            <img src="icon.jpg" alt="icon" class="icon">
        </div>

        <div class="title">
            <h1 class="merienda-font">Gaurav Ghimire</h1>
        </div>

        <div class="btn">
            <button class="login-btn">Log In</button>
            <button class="sign-up-btn">Sign Up</div> 
        </div>
    </header>

    <section>
        <div class=" detail-container merienda-font">
            <h2>Section : </h2><p style="margin-top: 30px;">AI6</p>

        </div>
        
    </section>
    
</body>
</html>
